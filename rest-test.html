<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        button {
            padding: 10px 15px;
            background: #3730a3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px 0;
        }
        pre {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 4px;
            overflow: auto;
        }
        .result {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Loops API Test</h1>
        
        <button id="testInsert">Test Loops API</button>
        
        <div class="result">
            <h3>Results:</h3>
            <pre id="results">Click a button to test Loops functionality...</pre>
        </div>
    </div>

    <script>
        function logResult(message) {
            const resultsElement = document.getElementById('results')
            resultsElement.textContent = message
            console.log(message)
        }
        
        // Loops integration function
        async function sendToLoops(data) {
          const response = await fetch("https://app.loops.so/api/v1/transactional", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer b7a8ef651c5cfa64cbd98540f95e6a1a",
            },
            body: JSON.stringify({
              transactionalId: "cma2n8wny011ixtaawxjj822f",
              email: "pat@persimmons.studio",
              data,
            }),
          });
          return response;
        }
        
        // Test Loops API insert button
        document.getElementById('testInsert').addEventListener('click', async () => {
            try {
                logResult('Testing Loops API...')
                
                // Create test data
                const testData = {
                    name: 'Test User',
                    email: 'test@example.com',
                    podcast: 'Test Podcast',
                    episodes: 4,
                    budget: '$3,000 – $4,000',
                    referral: 'Test',
                    message: 'This is a test submission via Loops API',
                    created_at: new Date().toISOString()
                }
                
                // Use Loops API
                const response = await sendToLoops(testData);
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => null) || await response.text();
                    logResult(`Loops API Error: ${response.status} ${response.statusText}\n\n${JSON.stringify(errorData, null, 2)}`)
                } else {
                    const data = await response.json().catch(() => 'No response body (success)');
                    logResult(`Loops API Request Successful!\n\nStatus: ${response.status}\n\nData: ${JSON.stringify(data, null, 2)}`)
                }
            } catch (err) {
                logResult(`Exception: ${err.message}\n\n${err.stack}`)
            }
        })
    </script>
</body>
</html>
